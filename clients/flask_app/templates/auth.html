<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ "Register" if mode == "register" else "Log in" }} · Broadcastex</title>
    <style>
      body {
        max-width: 440px;
        margin: 48px auto;
        padding: 0 16px;
        color: #24292f;
        font: 16px/1.5 system-ui, sans-serif;
      }
      form { display: grid; gap: 14px; }
      label { display: grid; gap: 5px; font-weight: 600; }
      input, button { padding: 9px; font: inherit; }
      button { cursor: pointer; }
      .error { color: #cf222e; }
    </style>
  </head>
  <body>
    <h1>{{ "Create account" if mode == "register" else "Log in" }}</h1>
    {% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
    <form method="post" action="{{ url_for('register_submit' if mode == 'register' else 'login_submit') }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <label>
        Username
        <input
          name="username"
          autocomplete="username"
          minlength="3"
          maxlength="32"
          pattern="[A-Za-z0-9_]{3,32}"
          value="{{ username }}"
          required
        >
      </label>
      <label>
        Password
        <input
          name="password"
          type="password"
          autocomplete="{{ 'new-password' if mode == 'register' else 'current-password' }}"
          minlength="{{ 8 if mode == 'register' else 1 }}"
          maxlength="1024"
          required
        >
      </label>
      <button type="submit">{{ "Register" if mode == "register" else "Log in" }}</button>
    </form>
    {% if mode == "register" %}
      <p>Already registered? <a href="{{ url_for('login') }}">Log in</a></p>
    {% else %}
      <p>New here? <a href="{{ url_for('register') }}">Create an account</a></p>
    {% endif %}
  </body>
</html>
