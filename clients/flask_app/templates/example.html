<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Broadcastex JavaScript client</title>
    <style>
      body {
        max-width: 760px;
        margin: 32px auto;
        padding: 0 16px;
        color: #24292f;
        font: 16px/1.5 system-ui, sans-serif;
      }
      form { display: grid; gap: 12px; }
      label { display: grid; gap: 4px; font-weight: 600; }
      input, select, button { padding: 8px; font: inherit; }
      button { cursor: pointer; }
      #status { min-height: 1.5em; }
      #status.error { color: #cf222e; }
      #members { padding-left: 20px; }
      #messages {
        min-height: 160px;
        max-height: 360px;
        overflow: auto;
        padding: 12px;
        border: 1px solid #d0d7de;
        border-radius: 6px;
        background: #f6f8fa;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }
    </style>
  </head>
  <body>
    <h1>Broadcastex JavaScript client</h1>
    <form method="post" action="{{ url_for('logout') }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <button type="submit">Log out</button>
    </form>
    <p>
      Subscribe to a public channel, receive events, and inspect presence updates.
      Flask authorizes protected channel subscriptions without exposing the app secret.
    </p>

    <form id="connectForm">
      <label>
        Channel
        <input id="channel" value="public-chat" required>
      </label>
      <button id="connect" type="submit">Connect and subscribe</button>
      <button id="disconnect" type="button" disabled>Disconnect</button>
    </form>

    <p id="status" role="status" aria-live="polite">Not connected</p>

    <section>
      <h2>Presence members</h2>
      <ul id="members"></ul>
    </section>

    <section>
      <h2>Events</h2>
      <pre id="messages" aria-live="polite"></pre>
    </section>

    <script>
      window.BROADCASTEX_CONFIG = {{ {"websocketUrl": websocket_url, "userId": user_id}|tojson }};
    </script>
    <script src="/broadcastex.js"></script>
    <script>
      const form = document.getElementById("connectForm");
      const connectButton = document.getElementById("connect");
      const disconnectButton = document.getElementById("disconnect");
      const status = document.getElementById("status");
      const messages = document.getElementById("messages");
      const members = document.getElementById("members");
      let client;

      function log(label, data) {
        const line = `${label}${data === undefined ? "" : ` ${JSON.stringify(data)}`}`;
        messages.textContent = `${line}\n${messages.textContent}`.slice(0, 12000);
      }

      function renderMembers(channel) {
        members.replaceChildren();
        for (const member of channel.memberList()) {
          const item = document.createElement("li");
          item.textContent = `${member.user_id}: ${JSON.stringify(member.user_info)}`;
          members.append(item);
        }
      }

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        connectButton.disabled = true;
        status.classList.remove("error");
        status.textContent = "Connecting...";

        try {
          client = new Broadcastex.BroadcastexClient(
            window.BROADCASTEX_CONFIG.websocketUrl,
            {
              authorize: async ({ socketId, channel, channelData }) => {
                const response = await fetch("/broadcastex/auth", {
                  method: "POST",
                  headers: { "content-type": "application/json" },
                  credentials: "same-origin",
                  body: JSON.stringify({
                    socket_id: socketId,
                    channel_name: channel,
                    channel_data: channelData
                  })
                });

                if (!response.ok) {
                  throw new Error(`Authorization failed (${response.status})`);
                }

                return response.json();
              }
            }
          );
          client.bind("error", (error) => {
            status.classList.add("error");
            status.textContent = error.message;
            log("Error:", error.message);
          });

          await client.connect();
          const channelName = document.getElementById("channel").value.trim();
          const options = channelName.startsWith("presence-")
            ? {
                userId: window.BROADCASTEX_CONFIG.userId,
                userInfo: {}
              }
            : {};
          const channel = await client.subscribe(channelName, options);

          channel.bind("client-message", (data) => log("Client message:", data));
          channel.onPresence({
            here: (currentMembers) => {
              log("Presence snapshot:", currentMembers);
              renderMembers(channel);
            },
            joining: (member) => {
              log("Presence member joined:", member);
              renderMembers(channel);
            },
            leaving: (member) => {
              log("Presence member left:", member);
              renderMembers(channel);
            }
          });
          status.classList.remove("error");
          status.textContent = `Connected and subscribed to ${channelName}`;
          disconnectButton.disabled = false;
        } catch (error) {
          status.classList.add("error");
          status.textContent = error.message;
          connectButton.disabled = false;
        }
      });

      disconnectButton.addEventListener("click", () => {
        client?.disconnect();
        client = null;
        members.replaceChildren();
        status.classList.remove("error");
        status.textContent = "Disconnected";
        connectButton.disabled = false;
        disconnectButton.disabled = true;
      });
    </script>
  </body>
</html>
